apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-filex-backend
  namespace: default
  labels:
    app: kube-filex
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-filex
      component: backend
  template:
    metadata:
      labels:
        app: kube-filex
        component: backend
    spec:
      serviceAccountName: kube-filex
      containers:
      - name: backend
        image: kube-filex:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-filex-frontend
  namespace: default
  labels:
    app: kube-filex
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-filex
      component: frontend
  template:
    metadata:
      labels:
        app: kube-filex
        component: frontend
    spec:
      containers:
      - name: frontend
        image: kube-filex-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
