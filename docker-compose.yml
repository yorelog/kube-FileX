version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kube-filex-backend
    ports:
      - "8080:8080"
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - KUBECONFIG=/root/.kube/config
    networks:
      - kube-filex

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kube-filex-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - kube-filex

networks:
  kube-filex:
    driver: bridge
